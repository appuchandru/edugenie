[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edugenie"
version = "0.1.0"
description = "A local study companion for college students"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "EduGenie Team" }
]
dependencies = []

[project.scripts]
edugenie = "edugenie.cli:main"

[tool.setuptools.packages.find]
where = ["."]
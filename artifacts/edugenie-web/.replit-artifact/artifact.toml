kind = "web"
previewPath = "/"
title = "EduGenie Web"
description = "The publishable EduGenie FastAPI learning assistant for the Nan Mudhalvan college project, with Gemini-powered Q&A, explanations, quizzes, summaries, and learning paths."
version = "1.0.0"
id = "artifacts/edugenie-web"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23706

[services.development]
run = "cd ../../edugenie && uvicorn main:app --host 0.0.0.0 --port $PORT"

[services.production]

[services.production.build]
args = ["python", "-m", "compileall", "-q", "edugenie"]

[services.production.run]
args = ["bash", "-lc", "cd edugenie && uvicorn main:app --host 0.0.0.0 --port $PORT"]

[services.production.run.env]
PORT = "23706"
PYTHONUNBUFFERED = "1"

[services.production.health.startup]
path = "/"

[services.env]
PORT = "23706"
BASE_PATH = "/"
